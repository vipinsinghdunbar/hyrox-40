/* BestDesignsOnX-inspired art direction: airy editorial canvas, oversized type, iris wash, cobalt accent and a tidy visual card grid. */
:root{--ink:#171923;--muted:#7e8290;--paper:#f8f8fb;--card:#fff;--line:#e9eaf0;--lime:#4f63e8;--lime-dark:#3c51d7;--violet:#6b61df;--orange:#ff845e;--green:#20a676;--shadow:0 14px 38px rgba(34,38,65,.07)}
body{background:radial-gradient(ellipse 520px 300px at 75% -80px,#e4e7ff 0%,rgba(228,231,255,0) 70%),#f8f8fb}
.page-title{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;letter-spacing:-.9px}
.eyebrow{color:#5263ce;letter-spacing:1.3px}
.hero{background:linear-gradient(118deg,#151823 0%,#202746 65%,#454d8b 100%);box-shadow:0 18px 46px rgba(39,45,93,.18)}
.hero h2{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.8px}
.hero:after{border-color:rgba(177,187,255,.2);box-shadow:0 0 0 32px rgba(174,181,255,.045),0 0 0 65px rgba(174,181,255,.025)}
.hero-art{opacity:1}.hero-art svg path:nth-of-type(2){stroke:#a9b3ff}.hero-art svg circle{fill:#d9ddff}
.btn-primary{background:var(--lime);color:#fff;box-shadow:0 7px 18px rgba(79,99,232,.22)}.btn-primary:hover{background:#4056dc}
.brand-mark{background:linear-gradient(135deg,#5069ec,#8677f2);color:white;box-shadow:0 5px 14px #5069ec35}
.streak-card{background:#e9ebff;border-color:#dce0ff}.streak-card .metric-label{color:#515981}
.week-day.current .day-mark,.agenda-today .agenda-day b{background:var(--lime);color:#fff}
.agenda-row.agenda-today{border-color:#cbd1ff;background:#f5f6ff}
.agenda-row:nth-child(2n){background:#fdfdff}
.agenda-row.agenda-done{background:#f0faf5}
.card{box-shadow:0 5px 22px rgba(39,44,69,.035)}
.card-title,.section-title h3{letter-spacing:-.25px}
.nav button.active{box-shadow:inset 3px 0 #8290ff}
.date-chip{border:1px solid #ececf3}
.welcome{background:radial-gradient(ellipse 440px 250px at 78% 0%,#dfe4ff 0%,rgba(223,228,255,0) 74%),#f8f8fb;color:var(--ink)}
.welcome-brand{color:var(--ink)}.welcome-brand small{color:#7e8290}
.welcome-card{border:1px solid #ebeaf2;box-shadow:0 20px 60px rgba(38,45,95,.1)}
.welcome-card h1{font-family:Georgia,'Times New Roman',serif;font-weight:700}.welcome-card h1 span{color:#4f63e8;font-style:italic}
.metric,.block{background:linear-gradient(145deg,#fff,#fafaff)}
.mobile-nav{background:rgba(255,255,255,.94);border-top-color:#e9eaf2}
@media(max-width:800px){.page-title{font-size:27px}.hero{background:linear-gradient(132deg,#151823,#252d55 67%,#4d5597)}.hero-art{opacity:.9}}

<style>

<script>
const DAYS=[
 {day:'Mon',short:'2.0 km run + 1,000 m SkiErg',name:'Run + SkiErg',title:'Run + Ski intervals',focus:'Strong but repeatable',type:'Run · SkiErg',blocks:[['06 MIN','Warm-up','Easy jog + moving mobility.'],['28 MIN','4 rounds','Repeat the shown distances; keep transitions easy and finish within the block.'],['06 MIN','Cool-down','Easy walk; let breathing settle.']],ex:[['Run','4 × 500 m','Steady, repeatable pace.','Select total metres.','m'],['SkiErg','4 × 250 m','Smooth pulls; do not sprint.','Select total metres.','m']]},
 {day:'Tue',short:'Sled push + pull · 4 × 12.5 m each',name:'Sled strength',title:'Sled + strength',focus:'Smooth, steady sled passes',type:'Strength · Sled',blocks:[['06 MIN','Warm-up','Easy row + 2 light sled passes.'],['28 MIN','Strength','Sled push + pull, then goblet squats. Rest 60–90 sec.'],['06 MIN','Cool-down','Walk and easy hip mobility.']],ex:[['Sled push','4 × 12.5 m','Target load shown for your selected division. Stop before the push or pull turns into a grind.','Select total sled load.','kg'],['Sled pull','4 × 12.5 m','Target load shown for your selected division. Stop before the push or pull turns into a grind.','Select total sled load.','kg'],['Goblet squat','3 × 8','Start load is level-based; keep 2–3 good reps in reserve.','Select dumbbell/kettlebell load.','kg']]},
 {day:'Wed',short:'2.0 km easy run + 800 m row',name:'Easy aerobic',title:'Easy run + row',focus:'Easy enough to talk',type:'Aerobic · Technique',blocks:[['06 MIN','Warm-up','Easy treadmill jog.'],['28 MIN','4 rounds','Keep each run easy enough to talk; use spare time for a relaxed walk.'],['06 MIN','Cool-down','Easy walk and light mobility.']],ex:[['Run','4 × 500 m','Easy enough to talk.','Select total metres.','m'],['Row','4 × 200 m','Relaxed strokes.','Select total metres.','m']]},
 {day:'Thu',short:'80 m burpees + 80 m lunges + 60 wall balls',name:'Stations',title:'Station practice',focus:'Technique first',type:'Stations',blocks:[['06 MIN','Warm-up','Easy jog + a few light practice reps.'],['28 MIN','4 rounds','20 m burpee broad jumps + 20 m sandbag lunges + 15 wall balls; rest as needed.'],['06 MIN','Cool-down','Walk and recover.']],ex:[['Burpee broad jumps','4 × 20 m','Steady jumps; step down if needed.','Select total metres.','m'],['Sandbag lunges','4 × 20 m','Short, controlled steps.','Select total metres.','m'],['Wall balls','4 × 15','Break before form slips.','Select total reps.','reps']]},
 {day:'Fri',short:'1.6 km run + 800 m row + 80 m carry + 48 wall balls',name:'HYROX blend',title:'Run + station blend',focus:'Steady race practice',type:'Race-specific',blocks:[['06 MIN','Warm-up','Easy jog + light station practice.'],['28 MIN','4 rounds','Move steadily through the shown run and station sequence; rest as needed.'],['06 MIN','Cool-down','Walk; finish feeling in control.']],ex:[['Run','4 × 400 m','Smooth pace, not a sprint.','Select total metres.','m'],['Row','4 × 200 m','Controlled strokes.','Select total metres.','m'],['Farmer carry','4 × 20 m','Tall posture; secure grip.','Select total metres.','m'],['Wall balls','4 × 12','Break before form fades.','Select total reps.','reps']]}
];
const defaults={page:'today',selected:null,profile:{setupComplete:false,level:'intermediate',race:'',days:'Mon–Fri',age:'',weight:'',height:'',gender:'',division:'open',goals:[],run1k:'',ski500:'',row500:'',goal:'first'},bodyChecks:[],logs:[],adjustments:{},session:null};
let state=load();let timerTick=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem('hyrox40')||'{}')}}catch{return {...defaults}}}
function persist(){localStorage.setItem('hyrox40',JSON.stringify(state))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayIdx=()=>{const d=new Date().getDay();return d===0||d===6?0:d-1};
const dayIndex=()=>todayIdx();
const dateText=()=>new Intl.DateTimeFormat('en-DK',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
const localDateStr=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const nav=[['today','⌂','Today'],['plan','▦','Plan'],['progress','↗','Progress'],['profile','⚙','Profile']];
function navHTML(){return `<div class="mobile-nav">${nav.map(([id,ic,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span><span>${label}</span></button>`).join('')}</div>`}
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">HYROX 40</div><div class="brand-sub">TRAIN WITH PURPOSE</div></div></div><div class="nav-label">YOUR TRAINING</div><nav class="nav">${nav.map(([id,ic,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${ic}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="coach-note"><b>Small sessions. Big engine.</b><p>Five focused 40-minute sessions, built around the kit you have at PureGym.</p></div><div class="side-foot">Made for your next finish line.<br>Train smart. Recover well.</div></div></aside>`}
function topbar(kicker,title){return `<header class="topbar"><div><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1></div><div class="top-right"><div class="date-chip">${dateText()}</div><div class="avatar">${initials()}</div></div></header>`}
function initials(){return 'H'}
function currentLog(i){return state.logs.find(l=>l.day===i&&l.date===localDateStr())}
function updateSelection(i){state.selected=i;persist();render()}
function standards(){const g=state.profile.gender,d=state.profile.division;if(g==='women')return d==='pro'?{label:'Women Pro',push:152,pull:103,farmer:24,lunge:20,wall:6}:{label:'Women Open',push:102,pull:78,farmer:16,lunge:10,wall:4};if(g==='men')return d==='pro'?{label:'Men Pro',push:202,pull:153,farmer:32,lunge:30,wall:9}:{label:'Men Open',push:152,pull:103,farmer:24,lunge:20,wall:6};return null}
function loadFactor(){return ({beginner:.5,intermediate:.65,advanced:.8})[state.profile.level]||.5}
function roundDown(n,step=2.5){return Math.floor(n/step)*step}
function trainingKg(race,day=null,j=null){let v=roundDown(race*loadFactor(),2.5);if(day!==null&&j!==null){const a=state.adjustments?.[`${day}-${j}`]||0;v=roundDown(v*(1+a/100),2.5)}return Math.max(0,Math.min(race,v))}
function wallBallTraining(race,day=null,j=null){const a=day===null?0:(state.adjustments?.[`${day}-${j}`]||0),desired=race*loadFactor()*(1+a/100),available=[2,3,4,5,6,7,8,9];return Math.min(race,available.find(n=>n>=desired)||9)}
function sledTarget(rx,race,day,j){const total=trainingKg(race,day,j),empty=+state.profile.sledEmpty||0;return empty?`${rx} · add ${Math.max(0,roundDown(total-empty))} kg plates (≈${total} kg total)`: `${rx} · ≈${total} kg total*`}
function goals(){return Array.isArray(state.profile.goals)?state.profile.goals:[]}
function roundsExtra(i){const g=goals();let n=0;if(g.includes('run')&&[0,2,4].includes(i))n++;if(g.includes('stations')&&[3,4].includes(i))n++;return Math.min(1,n)}
function prescribedCount(i,e){const m=e[1].match(/^(\d+)\s*[×x]/);if(!m)return 1;let n=+m[1];if(i===1&&goals().includes('strength'))n++;else n+=roundsExtra(i);return n}
function rawDistance(e){const m=e[1].match(/(\d+(?:\.\d+)?)\s*m/i);return m?+m[1]:0}
function recentCompleteLog(i,j){const today=new Date(localDateStr()+'T12:00:00');return state.logs.filter(l=>l.day===i&&l.completed?.[j]===true&&l.entries?.[j]!==''&&l.entries?.[j]!=null).sort((a,b)=>b.date.localeCompare(a.date)).find(l=>{const age=(today-new Date(l.date+'T12:00:00'))/86400000;return age>=0&&age<=42})}
function intervalPace(i,j,e){const prior=recentCompleteLog(i,j);if(prior){const sets=prior.sets?.[j]||+e[1].match(/^(\d+)/)?.[1]||1,dist=prior.distances?.[j]||rawDistance(e),feel=prior.feel,f=feel==='easy'?.98:feel==='hard'?1.03:feel==='tooHard'?1.07:1;if(dist>0)return (+prior.entries[j]/sets/dist)*f}
 const name=e[0],p=state.profile;let base=0,ref=500,factor=1.04;if(name==='Run'){base=+p.run1k||0;ref=1000;factor=i===2?1.12:1.05}else if(name==='SkiErg'){base=+p.ski500||0;factor=1.05}else if(name==='Row'){base=+p.row500||0;factor=1.06}else return 0;if(!base){const starters={beginner:{Run:420,SkiErg:180,Row:165},intermediate:{Run:360,SkiErg:150,Row:140},advanced:{Run:300,SkiErg:120,Row:120}};base=starters[p.level]?.[name]||360}return base/ref*factor}
function workoutDistance(i,j,e){const d=rawDistance(e),name=e[0];if(!['Run','SkiErg','Row'].includes(name)||!d)return d;const sets=prescribedCount(i,e),events=DAYS[i].ex.map((x,k)=>({x,k})).filter(({x})=>['Run','SkiErg','Row'].includes(x[0]));let timedPerRound=events.reduce((sum,{x,k})=>sum+intervalPace(i,k,x)*rawDistance(x),0),otherPerRound=i===4?90:0,budget=24*60,total=sets*(timedPerRound+otherPerRound);if(!timedPerRound||total<=budget)return d;let allowedPerRound=budget/sets-otherPerRound,scale=Math.max(0,Math.min(1,allowedPerRound/timedPerRound)),step=name==='Run'?50:25,min=name==='Run'?100:50;return Math.max(min,Math.floor(d*scale/step)*step)}
function effectivePrescription(i,e){const m=e[1].match(/^(\d+)\s*[×x]\s*(\d+)\s*m/i);let rx=e[1].replace(/^(\d+)\s*[×x]/,`${prescribedCount(i,e)} ×`);if(m&&['Run','SkiErg','Row'].includes(e[0])){const j=DAYS[i].ex.indexOf(e),dist=workoutDistance(i,j,e);rx=rx.replace(/(\d+(?:\.\d+)?)\s*m$/i,`${dist} m`)}return rx}
function formatClock(sec){if(sec==null||!Number.isFinite(+sec))return '—';sec=Math.max(0,Math.round(+sec/5)*5);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function clockPicker(id,min,max,step,value){let h=`<option value="" ${!value?'selected':''}>Not set yet</option>`;for(let t=min;t<=max;t+=step)h+=`<option value="${t}" ${+value===t?'selected':''}>${formatClock(t)}</option>`;return `<select id="${id}" class="wheel-select">${h}</select>`}
function timeResultPicker(j,value,maxSeconds=2400){const max=Math.min(7200,Math.max(2400,Math.ceil((maxSeconds+600)/300)*300));let h=`<option value="" ${!value?'selected':''}>Select achieved time…</option>`;for(let t=30;t<=max;t+=5)h+=`<option value="${t}" ${+value===t?'selected':''}>${formatClock(t)}</option>`;return `<select id="entry${j}" class="wheel-select" onchange="setEntry(${j},this.value)">${h}</select>`}
function targetInterval(i,j,e){const m=effectivePrescription(i,e).match(/(\d+)\s*[×x]\s*(\d+)\s*m/i);if(!m)return null;return Math.round(intervalPace(i,j,e)*(+m[2])/5)*5}
function estimateTarget(i,j,e){const name=e[0],p=state.profile,hasBase=name==='Run'?+p.run1k:name==='SkiErg'?+p.ski500:+p.row500;return !hasBase&&!recentCompleteLog(i,j)}
function intervalCount(i,e){const m=effectivePrescription(i,e).match(/^(\d+)\s*[×x]/);return m?+m[1]:1}

function exerciseTarget(i,j,e){const std=standards(),level=state.profile.level||'beginner',rx=effectivePrescription(i,e);if(['Run','SkiErg','Row'].includes(e[0])){const sec=targetInterval(i,j,e);return `${rx}${sec?` · ${estimateTarget(i,j,e)?'estimate ':''}${formatClock(sec)} each`:''}`}if(!std&&/Sled/.test(e[0]))return `${rx} · choose a smooth load`;if(!std&&/Farmer/.test(e[0]))return `${rx} · choose a secure pair`;if(!std&&/[Ll]unges/.test(e[0]))return `${rx} · choose a manageable bag`;if(!std&&/Wall balls/.test(e[0]))return `${rx} · choose a manageable ball`;if(e[0]==='Sled push')return sledTarget(rx,std.push,i,j);if(e[0]==='Sled pull')return sledTarget(rx,std.pull,i,j);if(e[0]==='Sandbag lunges')return `${rx} · ${trainingKg(std.lunge,i,j)} kg bag`;if(e[0]==='Farmer carry')return `${rx} · ${trainingKg(std.farmer,i,j)} kg / hand`;if(e[0]==='Wall balls')return `${rx} · ${wallBallTraining(std.wall,i,j)} kg ball`;if(e[0]==='Goblet squat'){const base=level==='beginner'?8:level==='intermediate'?12:16,a=state.adjustments?.[`${i}-${j}`]||0;return `${rx} · ${Math.max(2.5,Math.round(base*(1+a/100)/2.5)*2.5)} kg start`};return rx}
function logControl(i,j,e){if(['Run','SkiErg','Row'].includes(e[0])){const per=targetInterval(i,j,e),n=intervalCount(i,e),total=per?per*n:null;return `<div class="achievement"><div class="target-clock"><small>${estimateTarget(i,j,e)?'STARTER ESTIMATE':'TARGET'} · TOTAL WORK TIME</small><b>${total?formatClock(total):'Set by first effort'}</b>${per?`<span>${formatClock(per)} each × ${n} · rests excluded</span>`:'<span>Log this first effort to set a target</span>'}</div><label for="entry${j}">Achieved total time</label>${timeResultPicker(j,state.session?.entries?.[j],total||2400)}</div>`}if(e[4]==='kg')return `<div class="achievement"><label for="entry${j}">${e[0].startsWith('Sled')?(state.profile.sledEmpty?'Plates added':'Load setting used'):'Actual weight used'}</label><select id="entry${j}" class="wheel-select" onchange="setEntry(${j},this.value)">${rangeOptions(0,220,2.5,'kg',state.session?.entries?.[j])}</select></div>`;return `<div class="complete-hint">Tap the check when this movement is done</div>`}
function workoutHTML(i,mode='today'){const w=DAYS[i],done=currentLog(i),level=state.profile.level||'intermediate',main=w.blocks[1],weekGoals=goals(),completedCount=Object.values(state.session?.checked||{}).filter(Boolean).length,elapsed=state.session?.elapsed||0;let roundText=i===1?`${4+(goals().includes('strength')?1:0)} PUSH/PULL SETS`:main[1].toUpperCase();if(i!==1&&/^\d+ rounds$/i.test(main[1]))roundText=`${4+roundsExtra(i)} ROUNDS`;return `<div class="workout-header"><button class="back-btn" onclick="go('${mode==='today'?'today':'plan'}')">←</button><div><h2 class="workout-title">${w.title}</h2><p class="workout-sub">${w.day} · 40 min</p></div></div><div class="workout-brief"><div class="phase-strip"><span>06 MIN</span><b>WARM UP</b><small>${w.blocks[0][2]}</small></div><section class="main-work"><div class="main-kicker">MAIN SET · ${main[0]}</div><div class="round-count">${roundText}</div><div class="main-moves">${w.ex.map((e,j)=>`<div class="main-move"><small>${esc(e[0])}</small><b>${esc(effectivePrescription(i,e))}</b></div>`).join('')}</div><p>${main[2]}</p></section><div class="phase-strip cooldown"><span>06 MIN</span><b>COOL DOWN</b><small>${w.blocks[2][2]}</small></div></div><div id="timerCard" class="timer-card ${state.session?.running?'timer-running':''}"><div><div class="timer-title">40-minute timer</div><div class="timer-time" id="timerDisplay">${formatTimer(elapsed)}</div></div><div class="timer-controls"><button onclick="toggleTimer()" id="timerBtn">${state.session?.running?'Pause':'Start'}</button><button onclick="resetTimer()">Reset</button></div><div class="timer-progress" role="progressbar" aria-label="Workout time elapsed" aria-valuemin="0" aria-valuemax="2400" aria-valuenow="${elapsed}"><span id="timerProgress" style="width:${Math.min(100,elapsed/24)}%"></span></div></div><div class="section-title"><h3>Track this workout</h3><span>${completedCount} / ${w.ex.length} complete</span></div><div class="workout-progress" role="progressbar" aria-label="Movements completed" aria-valuemin="0" aria-valuemax="${w.ex.length}" aria-valuenow="${completedCount}"><span style="width:${completedCount/w.ex.length*100}%"></span></div><div class="exercise-list">${w.ex.map((e,j)=>{let id=`${i}-${j}`,adjv=state.adjustments?.[id]||0;return `<article class="exercise ${state.session?.checked?.[j]?'complete':''}"><div class="exercise-top"><button class="check ${state.session?.checked?.[j]?'on':''}" aria-label="Mark ${esc(e[0])} complete" onclick="toggleCheck(${j})">${state.session?.checked?.[j]?'✓':''}</button><div class="exercise-name">${esc(e[0])}</div></div><div class="exercise-target">${esc(exerciseTarget(i,j,e))}</div>${adjv?`<div class="exercise-adapt">${adjv>0?'Next time: a small step faster or heavier if this felt easy.':'Next time: reduce the load or pace.'}</div>`:''}<div class="exercise-tip">${e[2]}</div>${logControl(i,j,e)}</article>`}).join('')}</div><div class="card feeling-card"><b>How did the session feel?</b><select id="feel" class="wheel-select" onchange="setFeel(this.value)"><option value="easy" ${state.session?.feel==='easy'?'selected':''}>Easy · could do more</option><option value="onTarget" ${!state.session?.feel||state.session.feel==='onTarget'?'selected':''}>Just right · good quality</option><option value="hard" ${state.session?.feel==='hard'?'selected':''}>Hard · needed focus</option><option value="tooHard" ${state.session?.feel==='tooHard'?'selected':''}>Too hard · back off next time</option></select></div><p class="footnote">*Sled kg are approximate total-load targets. Add the unloaded sled weight in Profile to see plate kilos; turf friction varies, so start lighter.</p><div class="save-row"><span class="saved-note">${done?'✓ Saved today':''}</span><button class="btn btn-ghost" onclick="go('today')">Back</button><button class="btn btn-primary" onclick="saveWorkout(${i})">${done?'Update':'Save workout'}</button></div>`}
function rangeOptions(min,max,step,unit,selected){let html=`<option value="" ${selected===''||selected==null?'selected':''}>Choose…</option>`;for(let n=min;n<=max+1e-8;n+=step){const v=Number(n.toFixed(1)),txt=Number.isInteger(v)?String(v):v.toFixed(1);html+=`<option value="${txt}" ${String(selected)===txt?'selected':''}>${txt}${unit?' '+unit:''}</option>`}return html}
function resultOptions(kind,name,selected){if(kind==='m'){let max=name==='Run'?7000:name.toLowerCase().includes('sled')?500:5000,step=name==='Run'?50:name.toLowerCase().includes('sled')?5:25;return rangeOptions(0,max,step,'m',selected)}if(kind==='kg')return rangeOptions(0,220,2.5,'kg',selected);if(kind==='reps')return rangeOptions(0,200,1,'reps',selected);if(kind==='steps')return rangeOptions(0,120,1,'steps',selected);if(kind==='sec')return rangeOptions(0,600,5,'sec',selected);return rangeOptions(0,100,1,'',selected)}
function metricOptions(min,max,step,unit,value){return rangeOptions(min,max,step,unit,value)}

function formatTimer(sec){let m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function agendaDetail(i){const std=standards(),rx=j=>effectivePrescription(i,DAYS[i].ex[j]);if(i===0)return `${rx(0)} run · ${rx(1)} SkiErg`;if(i===1)return `${rx(0)} push · ${rx(1)} pull · ${std?trainingKg(std.push)+' / '+trainingKg(std.pull)+' kg':'choose category'}`;if(i===2)return `${rx(0)} easy run · ${rx(1)} row`;if(i===3)return `${rx(0)} jumps · ${rx(1)} lunges · ${rx(2)} wall balls`;return `${rx(0)} run · ${rx(1)} row · ${rx(2)} carry · ${rx(3)} wall balls`}

function weekAgenda(){return `<div class="week-agenda">${DAYS.map((d,i)=>`<button class="agenda-row ${i===dayIndex()?'agenda-today':''} ${currentLog(i)?'agenda-done':''}" onclick="openWorkout(${i},'plan')"><span class="agenda-day">${d.day}<b>${i+1}</b></span><span class="agenda-main"><b>${d.title}</b><small>${agendaDetail(i)}</small></span><span class="agenda-arrow">${currentLog(i)?'✓':'›'}</span></button>`).join('')}</div>`}

function goalNames(){const map={first:'First race',run:'Faster running',stations:'Station strength',strength:'Build strength'};return goals().map(x=>map[x]||x)}
function todayPage(){let i=dayIndex(),w=DAYS[i],done=currentLog(i),goalText=goalNames().join(' · ');return `${topbar('YOUR TRAINING','Today')}<div class="content"><section class="hero"><div class="hero-top"><span class="pulse"></span>${done?'WORKOUT SAVED':([0,6].includes(new Date().getDay())?'NEXT SESSION · MONDAY':`TODAY · ${w.day.toUpperCase()}`)}</div><h2>${done?'That’s today done.':w.title}</h2><p class="hero-desc">${agendaDetail(i)}</p><div class="hero-meta"><span class="pill"><strong>40</strong> min</span><span class="pill">${state.profile.level}</span></div><div class="hero-actions"><button class="btn btn-primary" onclick="openWorkout(${i})">${done?'Review workout':'Start workout'} →</button></div></section><div class="section-title"><h3>THIS WEEK</h3><span>5 short sessions</span></div>${weekAgenda()}<div class="metric-grid" style="margin-top:13px"><div class="metric"><div class="metric-value">${state.logs.length}</div><div class="metric-label">workouts logged</div></div><div class="metric"><div class="metric-value">${state.profile.weight||'—'}<span style="font-size:11px"> kg</span></div><div class="metric-label">latest weight</div></div><div class="metric"><div class="metric-value">${state.bodyChecks?.length||0}</div><div class="metric-label">check-ins</div></div></div><p class="footnote">Your focus: ${esc(goalText)}. Update it any time in Profile.</p></div>`}
function planPage(){const std=standards();return `${topbar('YOUR TRAINING','This week')}<div class="content"><div class="plan-summary"><b>5 DAYS · 40 MIN EACH</b><span>${std?.label||'Effort-based'} · ${state.profile.level}</span></div>${weekAgenda()}<div class="card race-reference"><b>Race weight reference · ${std?.label||'not selected'}</b><span>${std?`Push ${std.push} kg · pull ${std.pull} kg · carry ${std.farmer} kg/hand · lunge bag ${std.lunge} kg · wall ball ${std.wall} kg`:'Choose Women/Men + Open/Pro in Profile for race weights.'}</span></div></div>`}
function progressPage(){let logs=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date)),week=state.logs.filter(l=>isThisWeek(l.date)).length,recent=logs.slice(-8).reverse();return `${topbar('YOUR TRAINING','Progress')}<div class="content"><div class="progress-cards"><div class="progress-card"><div class="progress-number">${logs.length}</div><div class="progress-caption">workouts saved</div></div><div class="progress-card"><div class="progress-number">${week}<span style="font-size:13px;color:#969ba5"> / 5</span></div><div class="progress-caption">this week</div></div><div class="progress-card"><div class="progress-number">${state.bodyChecks?.length||0}</div><div class="progress-caption">body check-ins</div></div></div><div class="card body-stats" style="margin-top:14px"><div class="card-head"><div><div class="card-title">Your current stats</div><div class="card-caption">Update from Profile</div></div><button class="text-link" onclick="go('profile')">Edit →</button></div><div class="metric-grid"><div class="metric"><div class="metric-value">${state.profile.weight||'—'}<span style="font-size:11px"> kg</span></div><div class="metric-label">weight</div></div><div class="metric"><div class="metric-value">${state.profile.height||'—'}<span style="font-size:11px"> cm</span></div><div class="metric-label">height</div></div><div class="metric"><div class="metric-value">${state.profile.age||'—'}</div><div class="metric-label">age</div></div></div></div><div class="card history"><div class="card-head"><div><div class="card-title">Recent workouts</div><div class="card-caption">Times and weights you logged</div></div></div>${recent.length?recent.map(l=>`<div class="history-row"><div class="history-icon">✓</div><div class="history-copy"><b>${esc(l.title)}</b><span>${new Date(l.date+'T12:00:00').toLocaleDateString('en-DK',{weekday:'short',day:'numeric',month:'short'})} · ${loggedResults(l)}</span></div><div class="history-score">${feelLabel(l.feel)}</div></div>`).join(''):`<div class="empty-state"><div class="empty-icon">↗</div><h3>No workouts yet</h3><p>Complete a session to see your times and training loads here.</p></div>`}</div><p class="footnote">Saved on this device only.</p></div>`}
function feelLabel(f){return ({easy:'Easy',onTarget:'Just right',hard:'Hard',tooHard:'Too hard'})[f]||'—'}
function loggedResults(l){const vals=Object.entries(l.entries||{}).filter(([,v])=>v!==''&&v!=null).slice(0,2);return vals.length?vals.map(([j,v])=>{const e=DAYS[l.day]?.ex[+j];if(['Run','SkiErg','Row'].includes(e?.[0]))return `${e[0]} ${formatClock(v)}`;return `${e?.[0]||'Load'} ${v}${e?.[4]==='kg'?' kg':''}`}).join(' · '):'movement check-off'}
function chartHTML(logs){let groups={};logs.forEach(l=>{let d=new Date(l.date+'T12:00:00'),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));let k=mon.toISOString().slice(0,10);groups[k]=(groups[k]||0)+1});let arr=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).slice(-8),max=Math.max(5,...arr.map(x=>x[1]));let bars=arr.map((x,i)=>{let h=Math.max(9,x[1]/max*115),lab=new Date(x[0]+'T12:00:00').toLocaleDateString('en-DK',{day:'numeric',month:'short'});return `<g><rect x="${45+i*91}" y="${139-h}" width="37" height="${h}" rx="8" fill="${i===arr.length-1?'#5063e8':'#dcd9ff'}"/><text x="${63+i*91}" y="${157}" text-anchor="middle" fill="#888e99" font-size="9">${lab}</text><text x="${63+i*91}" y="${132-h}" text-anchor="middle" fill="#626977" font-size="9" font-weight="700">${x[1]}</text></g>`}).join('');return `<svg class="chart" viewBox="0 0 ${Math.max(300,arr.length*91+35)} 180" preserveAspectRatio="xMinYMin meet"><line x1="30" y1="140" x2="${Math.max(300,arr.length*91+15)}" y2="140" stroke="#e9ebef"/>${bars}</svg>`}
function timeFields(p){return `<div class="baseline-grid"><div class="field"><label for="run1k">Recent steady 1 km run</label>${clockPicker('run1k',180,900,15,p.run1k)}<small>Used to set run targets.</small></div><div class="field"><label for="ski500">Recent 500 m SkiErg</label>${clockPicker('ski500',90,600,10,p.ski500)}<small>Used to set SkiErg targets.</small></div><div class="field"><label for="row500">Recent 500 m row</label>${clockPicker('row500',90,600,10,p.row500)}<small>Optional.</small></div></div>`}
function sledEquipField(p){return `<div class="field"><label for="sledEmpty">Unloaded sled weight</label><select id="sledEmpty" class="wheel-select">${rangeOptions(0,80,2.5,'kg',p.sledEmpty)}</select><small>Optional. Set this to see an estimated plate amount as well as total sled target.</small></div>`}
function choiceGroup(field,options,selected){return `<div class="choice-grid" id="choices-${field}">${options.map(([v,label,sub])=>`<button type="button" class="choice-btn ${selected===v?'selected':''}" aria-pressed="${selected===v}" onclick="pickSingle('${field}','${v}')"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div><input type="hidden" id="${field}" value="${esc(selected||'')}">`}
function goalGroup(selected){let vals=Array.isArray(selected)?selected:[];const opts=[['first','First race','Finish feeling prepared'],['run','Faster running','Build run pace & volume'],['stations','Station strength','Sleds, carries, wall balls'],['strength','Get stronger','Build gym strength']];return `<div class="choice-grid goal-grid" id="choices-goals">${opts.map(([v,l,d])=>`<button type="button" class="choice-btn ${vals.includes(v)?'selected':''}" aria-pressed="${vals.includes(v)}" onclick="toggleGoal('${v}')"><b>${l}</b><small>${d}</small></button>`).join('')}</div><input type="hidden" id="goal" value='${JSON.stringify(vals)}'><small class="choice-help">Choose 2 or 3 goals.</small>`}
function categoryFields(p){return `<div class="field"><label>Race weight category</label>${choiceGroup('gender',[['women','Women','Women race weights'],['men','Men','Men race weights'],['none','No category','Use effort-based loads']],p.gender)}<small>Choose Women or Men, then select your division.</small></div><div class="field" id="divisionField"><label>Race division</label>${choiceGroup('division',[['open','Open',''],['pro','Pro','']],p.division||'open')}</div>`}
function pickSingle(field,value){const input=document.getElementById(field);if(!input)return;input.value=value;document.querySelectorAll(`#choices-${field} .choice-btn`).forEach(b=>{const on=b.getAttribute('onclick').includes(`'${value}'`);b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});if(field==='gender')updateDivisionField()}
function toggleGoal(value){const input=document.getElementById('goal');if(!input)return;let vals=JSON.parse(input.value||'[]');if(vals.includes(value))vals=vals.filter(x=>x!==value);else if(vals.length<3)vals.push(value);else{toast('Choose up to three goals.');return}input.value=JSON.stringify(vals);document.querySelectorAll('#choices-goals .choice-btn').forEach(b=>{const on=vals.some(v=>b.getAttribute('onclick').includes(`'${v}'`));b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))})}
function updateDivisionField(){const g=document.getElementById('gender'),f=document.getElementById('divisionField');if(f)f.style.display=g&&['women','men'].includes(g.value)?'block':'none'}
function experienceFields(p){return `<div class="field"><label>Training experience</label>${choiceGroup('level',[['beginner','New to HYROX','Build a base'],['intermediate','Regular training','Some race prep'],['advanced','Experienced','Train with race loads']],p.level||'beginner')}</div>`}
function welcomePage(){let p=state.profile;return `<main class="welcome"><div class="welcome-brand"><div class="brand-mark">H</div><div><b>HYROX 40</b><small>YOUR TRAINING PLAN</small></div></div><div class="welcome-card"><div class="eyebrow">ATHLETE SETUP · 1 OF 1</div><h1>Make it <span>yours.</span></h1><p class="welcome-copy">Choose your profile. Pick times from the wheels—no number typing.</p><div class="field"><label for="age">Age</label><select id="age" class="wheel-select">${metricOptions(16,90,1,'years',p.age)}</select></div><div class="field"><label for="weight">Weight</label><select id="weight" class="wheel-select">${metricOptions(35,250,0.5,'kg',p.weight)}</select></div><div class="field"><label for="height">Height</label><select id="height" class="wheel-select">${metricOptions(130,220,1,'cm',p.height)}</select></div>${experienceFields(p)}${categoryFields(p)}<div class="field"><label>Your main goals</label>${goalGroup(p.goals)}</div><details class="baseline-details"><summary>Set run & SkiErg target times</summary><p class="choice-help">Select a recent steady time. Skip if unknown; your first timed session becomes the baseline.</p>${timeFields(p)}</details><details class="baseline-details"><summary>Set PureGym sled weight (optional)</summary>${sledEquipField(p)}</details><label class="consent"><input type="checkbox" id="consent"><span>I’ll train within my limits and stop if I feel pain or unwell.</span></label><button class="btn btn-primary welcome-submit" onclick="completeSetup()">Build my plan →</button><p class="welcome-privacy">Measurements and workout history stay on this device.</p></div></main>`}
function profilePage(){let p=state.profile;return `${topbar('YOUR SETTINGS','Athlete profile')}<div class="content"><div class="card profile-card"><div class="card-title">Profile & plan targets</div><div class="field"><label for="age">Age</label><select id="age" class="wheel-select">${metricOptions(16,90,1,'years',p.age)}</select></div><div class="field"><label for="weight">Weight</label><select id="weight" class="wheel-select">${metricOptions(35,250,0.5,'kg',p.weight)}</select></div><div class="field"><label for="height">Height</label><select id="height" class="wheel-select">${metricOptions(130,220,1,'cm',p.height)}</select></div>${experienceFields(p)}${categoryFields(p)}<div class="field"><label>Main goals</label>${goalGroup(p.goals)}</div><details class="baseline-details" open><summary>Run & erg benchmarks</summary>${timeFields(p)}</details><details class="baseline-details"><summary>PureGym sled weight (optional)</summary>${sledEquipField(p)}</details><div class="field"><label for="race">Race date (optional)</label><input id="race" type="date" value="${esc(p.race||'')}"></div><div class="field"><label>Health & safety</label><div class="profile-check"><input id="safeCheck" type="checkbox" ${p.safety?'checked':''}><span>Stop if you feel pain or unwell; seek qualified advice for injuries or health concerns.</span></div></div><button class="btn btn-primary" onclick="saveProfile()">Save profile & check in</button></div><div class="card profile-history"><b>Measurement check-ins</b><div class="card-caption">${(state.bodyChecks||[]).length} saved</div>${(state.bodyChecks||[]).slice().reverse().map(c=>`<div class="history-row"><div class="history-icon">↗</div><div class="history-copy"><b>${new Date(c.date+'T12:00:00').toLocaleDateString('en-DK',{day:'numeric',month:'short',year:'numeric'})}</b><span>${c.age} years · ${c.height} cm</span></div><div class="history-score">${c.weight} kg</div></div>`).join('')}</div></div>`}

let renderedPage=null;function render(){if(!state.profile?.setupComplete||!state.profile.gender||!Array.isArray(state.profile.goals)){document.getElementById('app').innerHTML=welcomePage();updateDivisionField();return}const changed=renderedPage!==state.page;let html=state.page==='today'?todayPage():state.page==='plan'?planPage():state.page==='progress'?progressPage():state.page==='profile'?profilePage():state.page==='workout'?workoutHTML(state.selected,state.workoutSource):todayPage();document.getElementById('app').innerHTML=`<div class="shell">${sidebar()}<main class="main ${changed?'view-enter':''}">${html}</main></div>${navHTML()}`;renderedPage=state.page;updateDivisionField();if(state.session?.running&&state.page==='workout')startTick()}

function go(p){if(!state.profile?.setupComplete||!state.profile.gender)return;if(p==='today')state.selected=null;state.page=p;persist();render();window.scrollTo(0,0)}
function openWorkout(i,source='today'){state.selected=i;state.workoutSource=source;if(!state.session||state.session.day!==i||state.session.date!==localDateStr())state.session={day:i,date:localDateStr(),elapsed:0,running:false,checked:{},entries:{},feel:'onTarget'};state.page='workout';persist();render();window.scrollTo(0,0)}
function toggleCheck(j){state.session.checked=state.session.checked||{};state.session.checked[j]=!state.session.checked[j];persist();render()}
function setEntry(j,v){state.session.entries=state.session.entries||{};state.session.entries[j]=v;persist()}
function setFeel(v){state.session.feel=v;persist()}
function toggleTimer(){if(!state.session)state.session={day:dayIndex(),date:localDateStr(),elapsed:0,running:false,checked:{},entries:{},feel:'onTarget'};state.session.running=!state.session.running;if(state.session.running)startTick();else stopTick();persist();let b=document.getElementById('timerBtn'),card=document.getElementById('timerCard');if(b)b.textContent=state.session.running?'Pause':'Start';if(card)card.classList.toggle('timer-running',state.session.running)}
function startTick(){if(timerTick)return;timerTick=setInterval(()=>{if(!state.session||!state.session.running){stopTick();return}state.session.elapsed=(state.session.elapsed||0)+1;let d=document.getElementById('timerDisplay');if(d)d.textContent=formatTimer(state.session.elapsed);let progress=document.getElementById('timerProgress');if(progress)progress.style.width=Math.min(100,state.session.elapsed/24)+'%';if(state.session.elapsed>=2400){state.session.running=false;let card=document.getElementById('timerCard');if(card)card.classList.remove('timer-running');stopTick();toast('40 minutes — great work. Cool down and log your session.');let b=document.getElementById('timerBtn');if(b)b.textContent='Start timer'}persist()},1000)}
function stopTick(){if(timerTick){clearInterval(timerTick);timerTick=null}}
function resetTimer(){if(!state.session)return;state.session.elapsed=0;state.session.running=false;stopTick();persist();let d=document.getElementById('timerDisplay'),b=document.getElementById('timerBtn'),progress=document.getElementById('timerProgress');if(d)d.textContent='00:00';if(progress)progress.style.width='0%';if(b)b.textContent='Start timer'}
function saveWorkout(i){let w=DAYS[i],today=localDateStr(),entries=state.session?.entries||{},checks=state.session?.checked||{},completed=w.ex.map((_,j)=>!!checks[j]),checked=completed.filter(Boolean).length,feel=state.session?.feel||'onTarget';let log={date:today,day:i,title:w.title,feel,checked,total:w.ex.length,completed,entries,sets:w.ex.map(e=>intervalCount(i,e)),distances:w.ex.map(e=>['Run','SkiErg','Row'].includes(e[0])?+effectivePrescription(i,e).match(/(\d+(?:\.\d+)?)\s*m/i)?.[1]||0:null),elapsed:state.session?.elapsed||0};let old=state.logs.findIndex(l=>l.date===today&&l.day===i);if(old>=0)state.logs[old]=log;else state.logs.push(log);let adj=state.adjustments||{};for(let j=0;j<w.ex.length;j++){let id=`${i}-${j}`,cur=adj[id]||0;if(!completed[j])continue;if(feel==='easy'&&checked===w.ex.length)adj[id]=Math.min(15,cur+2.5);else if(feel==='tooHard'||(feel==='hard'&&checked<Math.ceil(w.ex.length/2)))adj[id]=Math.max(-15,cur-5)}state.adjustments=adj;state.session={...state.session,day:i,date:today,running:false,checked:checks,entries,feel};state.page='today';state.selected=null;persist();stopTick();render();window.scrollTo(0,0);toast(feel==='tooHard'?'Saved. We’ll ease the next session back.':'Saved. Nice work.')}

function readProfileFields(){let p=state.profile;return {age:+document.getElementById('age').value,weight:+document.getElementById('weight').value,height:+document.getElementById('height').value,level:document.getElementById('level').value,gender:document.getElementById('gender').value,division:document.getElementById('division')?.value||'open',goals:JSON.parse(document.getElementById('goal').value||'[]'),run1k:+document.getElementById('run1k').value||'',ski500:+document.getElementById('ski500').value||'',row500:+document.getElementById('row500').value||'',sledEmpty:+(document.getElementById('sledEmpty')?.value||0)||'',race:document.getElementById('race')?.value||p.race||'',safety:document.getElementById('safeCheck')?.checked||false}}
function validateProfile(p){if(!p.age||!p.weight||!p.height){toast('Choose age, weight and height.');return false}if(!p.level){toast('Choose your training experience.');return false}if(!p.gender){toast('Choose Women, Men or effort-based targets.');return false}if(['women','men'].includes(p.gender)&&!p.division){toast('Choose Open or Pro.');return false}if(p.goals.length<2||p.goals.length>3){toast('Choose two or three goals.');return false}return true}
function recordBodyCheck(p){state.bodyChecks=state.bodyChecks||[];const c={date:localDateStr(),age:p.age,weight:p.weight,height:p.height};const at=state.bodyChecks.findIndex(x=>x.date===c.date);if(at>=0)state.bodyChecks[at]=c;else state.bodyChecks.push(c)}
function completeSetup(){if(!document.getElementById('consent').checked){toast('Please confirm you’ll train within your limits.');return}const p=readProfileFields();if(!validateProfile(p))return;p.setupComplete=true;state.profile={...state.profile,...p};recordBodyCheck(p);state.page='today';persist();render();toast('Profile saved. Your plan is ready.')}
function saveProfile(){const p=readProfileFields();if(!validateProfile(p))return;state.profile={...state.profile,...p,setupComplete:true};recordBodyCheck(p);persist();toast('Profile and today’s measurements saved.');render()}

function resetData(){if(confirm('Delete all workout history and settings on this device?')){localStorage.removeItem('hyrox40');state=load();render();toast('App data reset')}}
function isThisWeek(ds){let date=new Date(ds+'T12:00:00'),now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);let end=new Date(start);end.setDate(start.getDate()+7);return date>=start&&date<end}
function calcStreak(){if(!state.logs.length)return 0;const dates=new Set(state.logs.map(l=>l.date));let cur=new Date();cur.setHours(12,0,0,0);let ds=localDateStr(cur);if(!dates.has(ds)){cur.setDate(cur.getDate()-1);while(cur.getDay()===0||cur.getDay()===6)cur.setDate(cur.getDate()-1);ds=localDateStr(cur)}let n=0;while(dates.has(ds)){n++;cur.setDate(cur.getDate()-1);while(cur.getDay()===0||cur.getDay()===6)cur.setDate(cur.getDate()-1);ds=localDateStr(cur)}return n}
let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
render();
let pendingWorker=null,appVersion=document.querySelector('meta[name="app-version"]')?.content||'dev',reloadAfterUpdate=false;
function showUpdateNotice(worker=null){pendingWorker=worker||pendingWorker;let banner=document.getElementById('appUpdateBanner');if(!banner){banner=document.createElement('div');banner.id='appUpdateBanner';banner.className='update-banner';banner.setAttribute('role','status');banner.setAttribute('aria-live','polite');banner.innerHTML='<span><b>Update ready</b><small>New training app improvements are available.</small></span><button type="button" onclick="applyAppUpdate()">Refresh</button>';document.body.appendChild(banner)}banner.classList.add('visible')}
function applyAppUpdate(){reloadAfterUpdate=true;if(pendingWorker)pendingWorker.postMessage({type:'SKIP_WAITING'});else location.reload()}
function checkAppBuild(){fetch('./version.json?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v?.version&&appVersion!=='dev'&&v.version!==appVersion)showUpdateNotice()}).catch(()=>{})}
function setupAppUpdates(){if(!('serviceWorker'in navigator)||!location.protocol.startsWith('http'))return;navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{const check=()=>{if(document.visibilityState==='visible'){reg.update().catch(()=>{});checkAppBuild()}};check();document.addEventListener('visibilitychange',check);setInterval(check,5*60*1000);if(reg.waiting&&navigator.serviceWorker.controller)showUpdateNotice(reg.waiting);reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdateNotice(worker)})});}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloadAfterUpdate)location.reload()})}
setupAppUpdates();
</script></body></html>
